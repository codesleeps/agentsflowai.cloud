version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentsflowai-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agentsflowai-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    container_name: agentsflowai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    networks:
      - agentsflowai-network
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:11434/api/tags && curl -f -X POST -H 'Content-Type: application/json' http://localhost:11434/api/generate -d '{\"model\":\"mistral:7b\",\"prompt\":\"test\",\"stream\":false}' --max-time 30"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s

networks:
  agentsflowai-network:
    driver: bridge

volumes:
  ollama-models:
