version: '3.8'

services:
  app:
    image: agentsflowai:latest
    container_name: agentsflowai-app-prod
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379
      - OLLAMA_WARMUP_ON_STARTUP=true
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agentsflowai-network
    # Production resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    # Health check with production settings
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Security
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    volumes:
      - uploads:/app/public/uploads
      - app-logs:/app/logs
    stop_grace_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: agentsflowai-ollama-prod
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
      - ollama-logs:/var/log/ollama
    restart: unless-stopped
    networks:
      - agentsflowai-network
    # Production resource limits for Ollama (increased to 6GB for larger models)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6G
        reservations:
          cpus: '2.0'
          memory: 4G
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Security
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  redis:
    image: redis:7-alpine
    container_name: agentsflowai-redis-prod
    restart: unless-stopped
    networks:
      - agentsflowai-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""

  nginx:
    image: nginx:alpine
    container_name: agentsflowai-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agentsflowai-network
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  agentsflowai-network:
    driver: bridge

volumes:
  ollama-models:
    driver: local
  ollama-logs:
    driver: local
  uploads:
    driver: local
  redis-data:
    driver: local
  app-logs:
    driver: local
  nginx-cache:
    driver: local
  nginx-logs:
    driver: local
